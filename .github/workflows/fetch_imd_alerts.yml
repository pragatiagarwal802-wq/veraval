name: Fetch IMD Alerts

on:
  schedule:
    # Separate schedule from the marine data workflow — every 3 hours,
    # at a different minute so both don't compete for the same runner slot.
    - cron: "45 * * * *"
  workflow_dispatch:

jobs:
  fetch-imd-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IMD alerts fetch script
        run: python fetch_imd_alerts.py

      - name: Commit and push new alert data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add imd_alerts/
          git diff --staged --quiet || git commit -m "Auto-fetch IMD alerts $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
