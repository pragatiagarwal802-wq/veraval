name: Fetch Real Marine Data

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 1. Fetch latest marine data
      - name: Run fetch script
        run: python fetch_real_marine_data.py

      # 2. Merge all fetched CSV files
      - name: Merge datasets
        run: python merge_data.py

      # 3. Commit updated data to GitHub
      - name: Commit and push new data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          git diff --staged --quiet || git commit -m "Auto-update marine data $(date -u +'%Y-%m-%d %H:%M UTC')"

          git push
