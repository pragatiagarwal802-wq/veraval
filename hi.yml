name: Fetch Real Marine Data

on:
  schedule:
    # Runs every 3 hours (cron uses UTC time, not IST)
    - cron: "0 */3 * * *"
  workflow_dispatch:   # lets you also trigger it manually from the GitHub Actions tab

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        run: python fetch_real_marine_data.py

      - name: Commit and push new data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Auto-fetch marine data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
